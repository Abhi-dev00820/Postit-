<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postit - Signup</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">

    <div class="Signup">
        <div class="auth-logo-box">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Postit Logo">
        </div>

        <h1>Postit Signup</h1>

        <div class="flash-container">
            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            {% endwith %}
        </div>

        <form method="POST" action="{{ url_for('signup') }}">
            <h2>Username</h2>
            <input type="text" name="UsernameS" placeholder="Your Username here" required>

            <h2>Password</h2>
            <input type="password" name="PasswordS" placeholder="Your Password here" required>

            <input type="submit" value="Sign Up">

            <h4>Already a User ? <a href="{{ url_for('login') }}">Login</a></h4>
        </form>
    </div>

</body>
</html>
